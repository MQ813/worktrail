[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "mail-jira-assistant"
version = "0.4.1"
requires-python = ">=3.11"
dependencies = ["pywin32>=310; sys_platform == 'win32'", "tzdata>=2025.1", "fastapi>=0.115,<1", "pydantic>=2,<3", "jinja2>=3,<4", "uvicorn>=0.30,<1"]
[project.optional-dependencies]
documents = ["pypdf>=5,<8"]
desktop = ["pywebview>=6,<7", "pywin32>=310; sys_platform == 'win32'"]
build = ["pyinstaller>=6,<7"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[project.scripts]
worktrail = "mail_jira_assistant.desktop:run"
mail-jira = "mail_jira_assistant.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.setuptools.package-data]
mail_jira_assistant = ["static/*.css", "static/*.js", "demo/inbox/*.eml", "demo/kb/*.md", "demo/jira/*.json", "samples/inbox/*.eml", "samples/jira/*.json", "samples/knowledge/*.md", "samples/assets/*.png", "samples/*.json", "samples/*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
